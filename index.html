<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>DOGE 策略面板 · 云端版</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --card2:#1c2330; --bd:#30363d;
    --tx:#e6edf3; --mut:#8b949e;
    --up:#f85149;   /* 红涨 */
    --dn:#3fb950;   /* 绿跌 */
    --warn:#d29922; --acc:#58a6ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font:14px/1.5 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding:16px}
  .wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .hd h1{font-size:18px;font-weight:600}
  .badge{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--bd)}
  .badge.paper{color:var(--warn);border-color:var(--warn)}
  .badge.live{color:var(--up);border-color:var(--up)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dn);display:inline-block;margin-right:6px}
  .dot.off{background:var(--up)}
  .hdtime{color:var(--mut);font-size:12px;margin-left:auto}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
  .kpi .lbl{color:var(--mut);font-size:12px}
  .kpi .val{font-size:20px;font-weight:600;font-family:ui-monospace,Consolas,monospace;margin-top:4px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row .card{flex:1;min-width:280px}
  .chip{display:inline-block;font-size:12px;padding:2px 10px;border-radius:6px;background:var(--card2);margin:2px 4px 2px 0}
  .chip b{font-family:ui-monospace,Consolas,monospace}
  .up{color:var(--up)} .dn{color:var(--dn)} .mut{color:var(--mut)}
  canvas{width:100%;height:140px;display:block}
  .ev{max-height:220px;overflow-y:auto;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
  .ev div{padding:3px 0;border-bottom:1px dashed #21262d;color:var(--mut)}
  .ev div:first-child{color:var(--tx)}
  .posbig{font-size:24px;font-weight:700;font-family:ui-monospace,Consolas,monospace}
  h2{font-size:13px;color:var(--mut);font-weight:500;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <h1>DOGE 合约 · 激进趋势版</h1>
    <span class="badge paper" id="mode">--</span>
    <span style="font-size:12px;color:var(--mut)"><span class="dot" id="dot"></span><span id="conn">连接中</span></span>
    <span class="hdtime" id="time">--</span>
  </div>

  <div class="grid">
    <div class="card kpi"><div class="lbl">余额 (USDT)</div><div class="val" id="balance">--</div></div>
    <div class="card kpi"><div class="lbl">最新价</div><div class="val" id="price">--</div></div>
    <div class="card kpi"><div class="lbl">今日开仓</div><div class="val" id="today">--</div></div>
    <div class="card kpi"><div class="lbl">持仓浮盈 (R)</div><div class="val" id="posr">--</div></div>
  </div>

  <div class="row">
    <div class="card">
      <h2>持仓状态</h2>
      <div id="posbox"><span class="mut">无持仓 · 观望中</span></div>
    </div>
    <div class="card">
      <h2>入场条件</h2>
      <div id="conds"></div>
    </div>
  </div>

  <div class="card">
    <h2>价格走势（最近采样）</h2>
    <canvas id="spark"></canvas>
  </div>

  <div class="card">
    <h2>交易事件</h2>
    <div class="ev" id="events"><div class="mut">暂无事件</div></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
function fmt(v, d=4){ return (v===null||v===undefined) ? "--" : Number(v).toFixed(d); }

function drawSpark(hist){
  const cv = $("spark"), ctx = cv.getContext("2d");
  const w = cv.clientWidth, h = cv.clientHeight, dpr = window.devicePixelRatio||1;
  if (cv.width !== w*dpr){ cv.width = w*dpr; cv.height = h*dpr; }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  if (!hist || hist.length < 2){
    ctx.fillStyle = "#8b949e"; ctx.font = "12px sans-serif";
    ctx.fillText("等待价格数据…", 8, 20); return;
  }
  const mn = Math.min(...hist), mx = Math.max(...hist), rg = (mx-mn)||1e-8;
  const X = i => 6 + i*(w-12)/(hist.length-1);
  const Y = v => 6 + (1-(v-mn)/rg)*(h-12);
  const rising = hist[hist.length-1] >= hist[0];
  const col = rising ? "#f85149" : "#3fb950";   // 红涨绿跌
  ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.beginPath();
  hist.forEach((v,i)=>{ i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)); });
  ctx.stroke();
  const lx = X(hist.length-1), ly = Y(hist[hist.length-1]);
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(lx,ly,3,0,7); ctx.fill();
  ctx.fillStyle = "#8b949e"; ctx.font = "11px ui-monospace,monospace";
  ctx.fillText(mx.toFixed(4), 8, 12);
  ctx.fillText(mn.toFixed(4), 8, h-4);
}

async function tick(){
  let d;
  try{
    const r = await fetch("https://korea-yards-lay-navy.trycloudflare.com/status.json?_="+Date.now(), {cache:"no-store"});
    d = await r.json();
    $("dot").className = "dot"; $("conn").textContent = "已连接";
  }catch(e){
    $("dot").className = "dot off"; $("conn").textContent = "连接失败（策略未运行？）";
    return;
  }
  $("time").textContent = d.time || "--";
  const m = $("mode");
  m.textContent = d.mode === "live" ? "实盘" : "纸面模拟";
  m.className = "badge " + (d.mode === "live" ? "live" : "paper");
  $("balance").textContent = fmt(d.balance,4);
  $("price").textContent = fmt(d.price,4);
  $("today").textContent = (d.today??"--") + " / " + (d.max_day??"--");

  const pr = $("posr"), pb = $("posbox");
  if (d.position){
    const r = d.position.r, cls = r>=0 ? "up" : "dn", sign = r>=0?"+":"";
    pr.textContent = sign + fmt(r,2); pr.className = "val " + cls;
    const side = d.position.side === "long" ? "做多 LONG" : "做空 SHORT";
    const sideCls = d.position.side === "long" ? "up" : "dn";
    pb.innerHTML =
      `<span class="posbig ${sideCls}">${side}</span>` +
      `<div style="margin-top:6px" class="mut">` +
      `持仓 <b>${fmt(d.position.contracts,0)}</b> 张 · 开仓价 <b>${fmt(d.position.entry,4)}</b><br>` +
      `最高 R <b>${fmt(d.position.max_r,2)}</b> · 香农已平 <b>${d.position.layers}</b> 层` +
      `</div>`;
  }else{
    pr.textContent = "--"; pr.className = "val";
    pb.innerHTML = '<span class="mut">无持仓 · 观望中</span>';
  }

  const t = d.trend, tTxt = t>0 ? "多" : (t<0 ? "空" : "震"),
        tCls = t>0 ? "up" : (t<0 ? "dn" : "mut"),
        bOk = d.boll_w !== null && d.boll_w >= d.boll_th;
  $("conds").innerHTML =
    `<span class="chip">BOLL宽 <b class="${bOk?'up':'mut'}">${fmt(d.boll_w,4)} / ${fmt(d.boll_th,3)}</b></span>` +
    `<span class="chip">RSI <b>${fmt(d.rsi,1)}</b></span>` +
    `<span class="chip">MACD <b class="${d.macd==='金叉'?'up':'dn'}">${d.macd||'--'}</b></span>` +
    `<span class="chip">M15趋势 <b class="${tCls}">${tTxt}</b></span>`;

  drawSpark(d.px_hist);

  const ev = $("events");
  if (d.events && d.events.length){
    ev.innerHTML = d.events.slice().reverse().map(s=>`<div>${s}</div>`).join("");
  }else{
    ev.innerHTML = '<div class="mut">暂无事件</div>';
  }
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
